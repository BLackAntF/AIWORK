# Ultralytics YOLO26 + Slim-Neck（GSConv / VoVGSCSP 轻量化颈部）
#
# 【改动说明 · 用于文档溯源】
# 本文件基于 ultralytics 8.4.174 自带的
#   ultralytics/cfg/models/26/yolo26.yaml
# 仅修改 head 部分，backbone 与官方完全一致，保证对比实验只体现 Slim-Neck 的作用。
#
# 改动明细（head，层索引与官方一致）：
#   13  C3k2 [512, True]              -> VoVGSCSP [512]
#   16  C3k2 [256, True]              -> VoVGSCSP [256]
#   17  Conv  [256, 3, 2]             -> GSConv  [256, 3, 2]
#   19  C3k2 [512, True]              -> VoVGSCSP [512]
#   20  Conv  [512, 3, 2]             -> GSConv  [512, 3, 2]
#   22  C3k2 [1024, True, 0.5, True]  -> VoVGSCSP [1024]
# 说明：C3k2 的 c3k 参数在 VoVGSCSP 中无对应项，按 Slim-Neck 论文实现使用默认
#       shortcut=True / e=0.5；其余 YAML 行与官方逐字一致。
#
# 预期（n 尺度，参考论文/文章）：约 2.46M 参数 / 5.6 GFLOPs（基线约 2.57M / 6.1）

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs

# YOLO26n backbone（与官方 yolo26.yaml 完全一致）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head（Slim-Neck 改造）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, VoVGSCSP, [512]] # 13 (原 C3k2 [512, True])

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, VoVGSCSP, [256]] # 16 (P3/8-small, 原 C3k2 [256, True])

  - [-1, 1, GSConv, [256, 3, 2]] # 17 (原 Conv)
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, VoVGSCSP, [512]] # 19 (P4/16-medium, 原 C3k2 [512, True])

  - [-1, 1, GSConv, [512, 3, 2]] # 20 (原 Conv)
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, VoVGSCSP, [1024]] # 22 (P5/32-large, 原 C3k2 [1024, True, 0.5, True])

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
