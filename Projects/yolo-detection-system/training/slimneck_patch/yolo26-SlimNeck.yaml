# Ultralytics YOLO26 + Slim-Neck（GSConv/VoVGSCSP 轻量化颈部）
# 基于官方 yolo26.yaml，将 head 中 C3k2 全部替换为 VoVGSCSP，
# 上下采样卷积替换为 GSConv；backbone 不变。
# n 尺度预期：约 2.46M 参数 / 5.6 GFLOPs（基线 yolo26n 约 2.57M / 6.1 GFLOPs）
# 训练时 nc 会被 data.yaml 的类别数自动覆盖

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 6.1 GFLOPs
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11-P4/16
  - [[-1, 6], 1, Concat, [1]] # 12-P4/16
  - [-1, 2, VoVGSCSP, [512]] # 13-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P3/8
  - [[-1, 4], 1, Concat, [1]] # 15-P3/8
  - [-1, 2, VoVGSCSP, [256]] # 16-P3/8

  - [-1, 1, GSConv, [256, 3, 2]] # 17-P4/16
  - [[-1, 13], 1, Concat, [1]] # 18-P4/16
  - [-1, 2, VoVGSCSP, [512]] # 19-P4/16

  - [-1, 1, GSConv, [512, 3, 2]] # 20-P5/32
  - [[-1, 10], 1, Concat, [1]] # 21-P5/32
  - [-1, 1, VoVGSCSP, [1024]] # 22-P5/32

  - [[16, 19, 22], 1, Detect, [nc]] # 23-P3/8,P4/16,P5/32
