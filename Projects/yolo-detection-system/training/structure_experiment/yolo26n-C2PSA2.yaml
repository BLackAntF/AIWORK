# YOLO26n + C2PSA 叠层实验
#
# 改动：backbone 最深层 C2PSA 重复次数 2 → 4（depth=0.5 后实际 1 → 2 个 PSABlock）
#   - 唯一变量 = C2PSA 层数，其余与官方 yolo26.yaml 完全一致
#   - C2PSA 是官方注册模块（在 tasks.py 的 base_modules 中），纯 yaml 改动，零源码修改
#   - 作为「结构改进」的低风险对照组：不改网络拓扑分支，只加深注意力块

nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO26n backbone (+C2PSA 叠层)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 4, C2PSA, [1024]] # 10-【改动】重复 2→4（实际 1→2 个 PSABlock）

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12-cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15-cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16-P3/8-small
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18-cat head P4
  - [-1, 2, C3k2, [512, True]] # 19-P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21-cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22-P5/32-large
  - [[16, 19, 22], 1, Detect, [nc]] # 23-Detect(P3, P4, P5)
