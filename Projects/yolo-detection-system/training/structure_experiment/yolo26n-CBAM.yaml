# YOLO26n + CBAM 结构改进实验
#
# 改动：在 backbone 的 P3 / P4 / P5 级输出后各插入一个 CBAM（通道+空间注意力）
#   - 其余结构、超参与官方 yolo26.yaml 完全一致（唯一变量 = CBAM）
#   - CBAM 来自官方 ultralytics 包（nn/modules/conv.py:592），非第三方代码
#   - 通道数按 n 尺寸手动指定（width=0.25）：P3=128 / P4=128 / P5=256
#
# 注意：插入层会改变后续索引，head 中的 Concat / Detect 引用已同步重编号

nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# YOLO26n backbone (+CBAM)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 输出 128ch
  - [-1, 1, CBAM, [128]] # 5-【新增】P3 注意力
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4 输出 128ch
  - [-1, 1, CBAM, [128]] # 8-【新增】P4 注意力
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10-P5 输出 256ch
  - [-1, 1, CBAM, [256]] # 11-【新增】P5 注意力
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 12
  - [-1, 2, C2PSA, [1024]] # 13

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15-cat backbone P4（改引 8）
  - [-1, 2, C3k2, [512, True]] # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18-cat backbone P3（改引 5）
  - [-1, 2, C3k2, [256, True]] # 19-P3/8-small
  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21-cat head P4
  - [-1, 2, C3k2, [512, True]] # 22-P4/16-medium
  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24-cat head P5（改引 13）
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 25-P5/32-large
  - [[19, 22, 25], 1, Detect, [nc]] # 26-Detect(P3, P4, P5)
